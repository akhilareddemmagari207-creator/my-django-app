<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Bus Booking Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <!-- 🟢 PREMIUM TRAVEL DESIGN STYLES START -->
    <style>
        body {
            /* Full luxury deep gradient mixed with a high-res travel bus overlay background */
            background: linear-gradient(rgba(15, 23, 42, 0.82), rgba(10, 15, 30, 0.96)), 
                        url('https://unsplash.com') no-repeat center center fixed !important;
            background-size: cover !important;
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif !important;
            color: #f8fafc !important;
            min-height: 100vh;
            margin: 0;
        }
        
        /* Glassmorphism Frosted Premium Navigation Layer */
        .navbar-dark.bg-dark {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(14px) !important;
            -webkit-backdrop-filter: blur(14px) !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35) !important;
            padding: 0.9rem 0 !important;
        }

        .navbar-nav-flex-row {
            display: flex !important;
            flex-direction: row !important;
            gap: 10px;
            padding-left: 0;
            margin-bottom: 0;
            list-style: none;
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500 !important;
            letter-spacing: 0.4px;
            padding: 0.6rem 1.1rem !important;
            border-radius: 8px;
            transition: all 0.25s ease-in-out;
        }

        /* High-tech Cyan/Neon Glow on link Hover */
        .nav-link:hover {
            color: #38bdf8 !important; 
            background: rgba(56, 189, 248, 0.12) !important;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Warning text labels polished to Premium Coral Orange */
        .text-warning {
            color: #ff7849 !important;
            font-weight: 600 !important;
        }
        .text-warning:hover {
            background: rgba(255, 120, 73, 0.1) !important;
            text-shadow: 0 0 8px rgba(255, 120, 73, 0.4);
        }
    </style>
    <!-- 🔴 PREMIUM TRAVEL DESIGN STYLES END -->
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <!-- Changed ul to a row structure so items look correctly aligned horizontally -->
        <ul class="navbar-nav-flex-row">
            {% if user.is_authenticated %} 
                {% if user.vendorregistration %}
                    <li class="nav-item"><a class="nav-link text-warning" href="{% url 'vendor_dashboard' %}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                
                {% else %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'logout' %}">Logout</a></li>
                {% endif %}

            {% else %}
             
                <li class="nav-item"><a class="nav-link" href="{% url 'register' %}">Register</a></li>
                <li class="nav-item"><a class="nav-link text-warning" href="{% url 'vendor_register' %}">Vendor Register</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Login</a></li>
            {% endif %}
        </ul>
    </div>
</nav>

    {% block content %}

    {% endblock %}

</body>
</html>
